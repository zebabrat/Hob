name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same branch cancels the run still in flight for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The Prisma Client is generated code and is not committed, so the backend
      # cannot typecheck until it exists. No database is contacted here.
      - name: Generate Prisma Client
        run: npm run db:generate -w @hob/backend

      - name: Build all workspaces
        run: npm run build

      - name: Lint
        run: npm run lint
