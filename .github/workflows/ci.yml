name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same branch cancels the run still in flight for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # The backend's postinstall runs `prisma generate` here: the client is
      # generated code, is not committed, and the backend cannot typecheck
      # without it. No database is contacted.
      - name: Install dependencies
        run: npm ci

      - name: Build all workspaces
        run: npm run build

      - name: Lint
        run: npm run lint
